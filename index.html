<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:#fff;color:#000;
  font-family:"EB Garamond",Garamond,"Times New Roman",Georgia,serif;
  font-size:clamp(19px,2.3vw,21px);line-height:1.62;font-feature-settings:"liga","onum"}
@media (min-width:900px){body{font-size:23px}}
header{max-width:34rem;margin:0 auto;padding:5rem 1.5rem 3.5rem;text-align:center}
h1{font-weight:400;font-size:clamp(2.2rem,7vw,3.2rem);line-height:1.1;margin:0;letter-spacing:.01em}
.trips{max-width:44rem;margin:0 auto 5rem;padding:0 1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:1.5rem}
@media (max-width:560px){.trips{grid-template-columns:1fr;gap:2.5rem}}
.trip{display:block;color:#000;text-decoration:none;text-align:center}
.trip .frame{display:block;width:100%;aspect-ratio:3/2;background:#F1F1EE;overflow:hidden}
.trip img{display:block;width:100%;height:100%;object-fit:cover;box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 1px rgba(0,0,0,.08)}
.trip .t{display:block;margin-top:.7rem;font-style:italic;font-size:1.25em;line-height:1.2}
.trip .s{display:block;margin-top:.2rem;font-size:.85em;color:#555;font-style:italic}
a.trip:hover .t{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.2em}
.trip.soon{cursor:default}
.trip.soon .t{color:#555}
</style>

</nav>
